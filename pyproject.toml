[project]
name = "gbm-dashboard"
version = "0.1.0"
description = "Dashboard de inversiones generado a partir de los estados de cuenta de GBM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
]

[project.scripts]
gbm = "gbm_dashboard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gbm_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
